name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint and format check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build both distributions
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Confirm the benchmark table is current
        run: |
          npm run benchmark
          # The generator emits a plain markdown table; Prettier owns the final
          # formatting, so normalise before diffing or this always reports drift.
          npx prettier --write README.md
          if ! git diff --quiet README.md; then
            echo "The README benchmark table is out of date. Run 'npm run benchmark' and commit the result."
            git --no-pager diff README.md
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-file-build
          path: dist/ii-description-wizard.html
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Ship the single-file artifact alongside the Pages build so it can be
      # downloaded straight from the site and emailed on.
      - name: Stage the single-file download
        run: cp dist/ii-description-wizard.html dist/pages/ii-description-wizard.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages
      - id: deployment
        uses: actions/deploy-pages@v4
